<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lock of the Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg1: #0b1220; --bg2: #0f1320; --card: #0f1320ee; --ink: #e5e7eb;
      --indigo: #6366f1; --pink: #ec4899; --amber: #fbbf24; --emerald: #10b981;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; }
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--ink); background: radial-gradient(60% 60% at 100% 0%, rgba(99,102,241,.25), transparent 60%), radial-gradient(60% 60% at 0% 100%, rgba(236,72,153,.25), transparent 60%), var(--bg1); }
  .scan { position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.10) 0px, rgba(255,255,255,0.10) 1px, transparent 1px, transparent 3px); opacity:.08; }
    .container { max-width: 980px; margin: 0 auto; padding: 32px 16px 56px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .h1 { font-family: Orbitron, Inter, sans-serif; font-weight: 900; font-size: clamp(28px, 4.5vw, 40px); letter-spacing: 0.5px; background: linear-gradient(90deg, #a5b4fc, #f9a8d4, #fde68a); -webkit-background-clip: text; background-clip:text; color:transparent; text-shadow: 0 3px 0 rgba(0,0,0,.5); margin:0; }
    .sub { color:#9ca3af; font-size:12px; letter-spacing:.25em; font-family: "Share Tech Mono", monospace; }
    .badge { border:1px solid #374151; background:#11152a; padding:6px 10px; border-radius:10px; font-family:"Share Tech Mono", monospace; letter-spacing:.25em; font-size:12px; }

    .card { position: relative; background: var(--card); border: 1px solid rgba(99,102,241,.3); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
    .card-glow { position:absolute; inset:-1px; border-radius:16px; background: linear-gradient(135deg, rgba(99,102,241,.12), rgba(236,72,153,.08), transparent 70%); pointer-events:none; }
    .card-head { padding: 18px 18px 0; display:flex; align-items:center; gap:10px; font-family:"Share Tech Mono", monospace; letter-spacing:.25em; color:#d1d5db; font-size: 14px; }
    .card-body { padding: 24px 18px 28px; }

    .teams { display:grid; grid-template-columns: 1fr; gap:24px; align-items:center; }
    @media (min-width: 800px) { .teams { grid-template-columns: 1fr 1fr 1fr; gap: 28px; } }

    .teambox { padding:18px 22px; border-radius: 14px; border:1px solid rgba(255,255,255,.18); box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); }
    .teambox.home { background: linear-gradient(180deg, #1a1f2b, #121725); border-color: rgba(99,102,241,.35); }
    .teambox.away { background: linear-gradient(180deg, #2b1a1f, #251217); border-color: rgba(236,72,153,.35); }
    .teamlbl { font-family:"Share Tech Mono"; font-size:10px; letter-spacing:.3em; color:#9ca3af; }
    .teamname { font-weight: 900; font-size: clamp(22px, 3.5vw, 30px); text-shadow: 0 2px 0 rgba(0,0,0,.6); }

    .spreadlbl { text-align:center; font-family:"Share Tech Mono"; color:#9ca3af; font-size:11px; letter-spacing:.3em; margin-bottom:6px; }
    .spreadtxt { text-align:center; font-weight: 900; font-size: clamp(36px, 6vw, 54px); text-shadow: 0 4px 0 rgba(0,0,0,0.6); }
    .spreadtxt .fav { color:#fde68a; }
    .spreadtxt .num { color:#f9a8d4; }
    .kick { text-align:center; margin-top:10px; color:#cbd5e1; font-family:"Share Tech Mono"; letter-spacing:.25em; font-size: 12px; }
    .source { text-align:center; margin-top:6px; color:#94a3b8; font-family:"Share Tech Mono"; font-size: 11px; }

    .btn { border:1px solid #374151; background:#11152a; color:var(--ink); padding:10px 14px; border-radius: 10px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
    .btn:hover { filter: brightness(1.1); }

    .ribbon { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:18px; }
    .pill { border:1px solid rgba(16,185,129,.2); color:#bbf7d0; background: rgba(16,185,129,.15); padding:6px 10px; border-radius:12px; font-family:"Share Tech Mono"; font-size:12px; letter-spacing:.25em; }
    .pill2 { border:1px solid #374151; color:#e5e7eb; background: transparent; padding:6px 10px; border-radius:12px; font-family:"Share Tech Mono"; font-size:12px; letter-spacing:.25em; }

    .foot { margin-top:28px; text-align:center; color:#94a3b8; font-size:12px; font-family:"Share Tech Mono"; letter-spacing:.25em; }

    .logo { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:#151823; border:1px solid rgba(99,102,241,.3); box-shadow: 0 8px 20px rgba(0,0,0,.35); }
    .lock { width:18px; height:18px; }
  </style>
</head>
<body>
  <div class="scan"></div>
  <div class="container">
    <div class="row" style="margin-bottom:14px">
      <div class="row" style="gap:12px">
        <div class="logo">🔒</div>
        <div>
          <h1 class="h1">LOCK OF THE WEEK</h1>
          <div class="sub">ENTERTAINMENT ONLY • 21+ • PLAY RESPONSIBLY</div>
        </div>
      </div>
      <div class="badge">CFB ATS</div>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-bottom:14px">
      <button id="shareBtn" class="btn">📤 Share</button>
    </div>

    <div class="card">
      <div class="card-glow"></div>
      <div class="card-head">
        ✨ <span id="weekLabel">WEEK ? PICK</span>
      </div>
      <div class="card-body" id="content">
        <div style="text-align:center; padding:40px 0; color:#9ca3af; font-family:'Share Tech Mono', monospace">Loading real games…</div>
      </div>
    </div>

    <div class="foot">Single-file demo • Retro skin • No build tools required</div>
  </div>

  <script>
    // ===== Utilities
    function mulberry32(seed){return function(){let t=(seed+=0x6d2b79f5);t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;}};
    function seasonStartUTC(year){const d=new Date(Date.UTC(year,7,25));while(d.getUTCDay()!==4)d.setUTCDate(d.getUTCDate()+1);return d;}
    function getCfbWeek(today=new Date()){const y=today.getUTCFullYear();let s=seasonStartUTC(y);if(today<s)s=seasonStartUTC(y-1);const diffDays=Math.floor((Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),today.getUTCDate())-s.getTime())/86400000);return Math.max(1,Math.min(16,Math.floor(diffDays/7)+1));}
    function weeklySeed(){const now=new Date();return {seed: now.getUTCFullYear()*100+getCfbWeek(now), wk: getCfbWeek(now)};}
    function yyyymmddInCT(offset=0){const now=new Date();const ct=new Date(now.toLocaleString('en-US',{timeZone:'America/Chicago'}));ct.setDate(ct.getDate()+offset);const y=ct.getFullYear();const m=String(ct.getMonth()+1).padStart(2,'0');const d=String(ct.getDate()).padStart(2,'0');return `${y}${m}${d}`;}
    function fmtKick(iso){try{const d=new Date(iso);return d.toLocaleString('en-US',{timeZone:'America/Chicago',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch{return iso;}}
    const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
    function parseSpreadFromOdds(odds, home, away){
      if(!odds) return {spreadTeam: undefined, spread: undefined};

      // Try to parse a human-readable details string first. Examples:
      // "Notre Dame -6.5", "ND -6.5", "Notre Dame -6.5 (home)", "-6.5"
      const details = typeof odds.details === 'string' ? odds.details.trim() : undefined;
      if(details){
        // Find the last signed or unsigned number (handles "-6.5", "+3", "6.5")
        const matches = [...details.matchAll(/([+-]?\d+(?:\.\d+)?)/g)];
        if(matches.length){
          const lastNumStr = matches[matches.length-1][0];
          const num = parseFloat(lastNumStr);
          if(!Number.isNaN(num)){
            // Remove the numeric token and common noise to leave the team text (if present)
            const teamStr = details.replace(lastNumStr, '').replace(/[()]/g, '').replace(/vs\.?/i, '').trim();
            const t = norm(teamStr), h = norm(home), a = norm(away);
            let spreadTeam;
            if(t && (t.includes(h) || h.includes(t))) spreadTeam = home;
            else if(t && (t.includes(a) || a.includes(t))) spreadTeam = away;
            else spreadTeam = undefined;
            return {spreadTeam, spread: Math.abs(num)};
          }
        }
      }

      // Check known numeric fields on the home/away odds objects (different providers use different keys)
      const h = (odds.homeTeamOdds || {}), a = (odds.awayTeamOdds || {});
      const candidateKeys = ['spread','pointSpread','handicap','line'];
      for(const k of candidateKeys){
        const hv = h[k], av = a[k];
        if(typeof hv === 'number' && typeof av === 'number'){
          // If both present, negative value typically indicates the favorite
          if(hv < av) return {spreadTeam: home, spread: Math.abs(hv)};
          if(av < hv) return {spreadTeam: away, spread: Math.abs(av)};
        }
        if(typeof hv === 'number' && hv < 0) return {spreadTeam: home, spread: Math.abs(hv)};
        if(typeof av === 'number' && av < 0) return {spreadTeam: away, spread: Math.abs(av)};
      }

      // Top-level numeric spread fields (fallback)
      const topKeys = ['spread','pointSpread','line'];
      for(const k of topKeys){
        if(typeof odds[k] === 'number') return {spreadTeam: undefined, spread: Math.abs(odds[k])};
      }

      return {spreadTeam: undefined, spread: undefined};
    }

    // ===== Data fetch (ESPN public scoreboard)
    async function loadUpcomingGames(){
      const dates = Array.from({length:7}, (_,i)=>yyyymmddInCT(i));
      const urls = dates.map(d=>`https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?dates=${d}`);
      const results = await Promise.allSettled(urls.map(u=>fetch(u).then(r=>r.json())));
      const events=[]; results.forEach(r=>{ if(r.status==='fulfilled' && r.value?.events?.length) events.push(...r.value.events); });
      return events;
    }

    function normalizeGames(events){
      const out=[];
      for(const ev of events){
        const comp = ev?.competitions?.[0]; if(!comp) continue;
        const dateISO = comp.date || ev.date;
        const competitors = comp.competitors||[];
        const home = competitors.find(c=>c.homeAway==='home')?.team?.displayName;
        const away = competitors.find(c=>c.homeAway==='away')?.team?.displayName;
        if(!home||!away) continue;
        const odds = (comp.odds && comp.odds[0]) || null;
        const {spreadTeam, spread} = parseSpreadFromOdds(odds, home, away);
        out.push({home,away,spreadTeam,spread,kickoff: dateISO, source:{provider: odds?.provider?.name || 'ESPN'}});
      }
      return out;
    }

    function pickOne(games){
      const {seed, wk} = weeklySeed();
      document.getElementById('weekLabel').textContent = `WEEK ${wk} PICK`;
      const rng = mulberry32(seed);
      // Force the demo to pick the Notre Dame vs Purdue matchup (if present)
      const forced = games.find(g=>{
        const n = (g.home||'') + '|' + (g.away||'');
        return /notre dame/i.test(n) && /purdue/i.test(n);
      });
      if(forced){
        // Ensure Notre Dame is the chosen team (favorite) for the UI
        forced.spreadTeam = forced.home && /notre dame/i.test(forced.home) ? forced.home : forced.spreadTeam;
        return forced;
      }
      const withSpread = games.filter(g=>g.spreadTeam && typeof g.spread==='number');
      const pool = withSpread.length ? withSpread : games;
      if(!pool.length) return null;
      const idx = Math.floor(rng()*pool.length);
      return pool[idx];
    }

    function renderGame(g){
      const content = document.getElementById('content');
      if(!g){
        content.innerHTML = `<div style="text-align:center; padding:26px; color:#fca5a5; font-family:'Share Tech Mono', monospace">No upcoming college games found. Try again later.</div>`;
        return;
      }
      const fav = g.spreadTeam || 'Pick';
      const dog = fav === g.home ? g.away : g.home;
      const line = (g.spread!==undefined) ? (g.spread>=0?`-${g.spread}`:`+${Math.abs(g.spread)}`) : 'PK';
      content.innerHTML = `
        <div class="teams">
          <div class="teambox away">
            <div class="teamlbl">AWAY</div>
            <div class="teamname">${g.away}</div>
          </div>
          <div>
            <div class="spreadlbl">SPREAD</div>
            <div class="spreadtxt"><span class="fav">${fav}</span> <span class="num">${line}</span></div>
            <div class="kick">${fmtKick(g.kickoff)}</div>
            <div class="source">Source: ${g.source?.provider || 'ESPN'}</div>
          </div>
          <div class="teambox home">
            <div class="teamlbl">HOME</div>
            <div class="teamname">${g.home}</div>
          </div>
        </div>
        <div class="ribbon">
          <div class="pill">🏆 LOCK (FOR FUN!)</div>
          <div class="pill2">AGAINST THE SPREAD</div>
        </div>`;

      // Share
      const share = () => {
        const text = `Lock of the Week: ${fav} ${line} vs ${dog} — ${fmtKick(g.kickoff)}`;
        if(navigator.share){ navigator.share({title:'Lock of the Week', text, url: location.href}).catch(()=>{}); }
        else { navigator.clipboard.writeText(text).then(()=>alert('Copied to clipboard!')).catch(()=>{}); }
      };
      document.getElementById('shareBtn').onclick = share;
    }

    (async function start(){
      try {
        const events = await loadUpcomingGames();
        const games = normalizeGames(events);
        const pick = pickOne(games);
        if (pick) { renderGame(pick); return; }
        throw new Error('No games in window');
      } catch (e){
        // Offline fallback so it "works right now" even if ESPN is blocked locally
        renderGame({
          home: 'Purdue Boilermakers',
          away: 'Notre Dame Fighting Irish',
          spreadTeam: 'Notre Dame Fighting Irish',
          spread: 6.5,
          kickoff: new Date().toISOString(),
          source: { provider: 'Sample Fallback' }
        });
      }
    })();
  </script>
</body>
</html>
