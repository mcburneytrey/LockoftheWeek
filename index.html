<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lock of the Week</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <div class="scan" aria-hidden="true"></div>

  <div class="container">
    <div class="row" style="align-items:flex-start; justify-content:space-between;">
      <div style="display:flex; gap:12px; align-items:center;">
        <div class="logo" aria-hidden="true">🔒</div>
        <div>
          <h1 class="h1">LOCK OF THE WEEK</h1>
          <div class="sub">ENTERTAINMENT ONLY • 21+ • PLAY RESPONSIBLY</div>
        </div>
      </div>

      <div>
        <div class="badge">CFB ATS</div>
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end; margin-bottom:14px">
      <button id="shareBtn" class="btn" aria-label="Share lock">📤 Share</button>
    </div>

    <div class="card" role="region" aria-labelledby="weekLabel">
      <div class="card-glow" aria-hidden="true"></div>
      <div class="card-head">
        ✨ <span id="weekLabel">WEEK ? PICK</span>
      </div>
      <div class="card-body" id="content">
        <div class="loading">Loading real games…</div>
      </div>
    </div>

    <div class="foot">Single-file demo • Retro skin • No build tools required</div>
  </div>

  <script src="js/app.js?v=202510232103" defer></script>
</body>
</html>
